name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: rustdm
            desktop_binary: rustdm-ui
            native_binary: rustdm-browser-host
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: rustdm.exe
            desktop_binary: rustdm-ui.exe
            native_binary: rustdm-browser-host.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --workspace --release --locked
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Browser setup tests
        run: python -m unittest discover -s tests/browser -p "test_*.py"
      - name: Extension and native bridge integration
        env:
          RUSTDM_NATIVE_HOST: ${{ github.workspace }}/target/release/${{ matrix.native_binary }}
          RUSTDM_CLI: ${{ github.workspace }}/target/release/${{ matrix.binary }}
        run: node --test tests/browser/extension.test.mjs
      - name: Package and check executable version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: >-
          python .github/scripts/package_release.py
          --target ${{ matrix.target }}
          --binary target/release/${{ matrix.binary }}
      - name: Package desktop preview
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: >-
          python .github/scripts/package_release.py
          --app desktop
          --target ${{ matrix.target }}
          --binary target/release/${{ matrix.desktop_binary }}
      - name: Package browser bridge
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: >-
          python .github/scripts/package_release.py
          --app browser
          --target ${{ matrix.target }}
          --binary target/release/${{ matrix.native_binary }}
      - name: Check packaged executable
        shell: bash
        run: python .github/scripts/check_package.py dist
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: rustdm-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
