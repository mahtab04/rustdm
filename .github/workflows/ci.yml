name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: rustdm
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: rustdm.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --workspace --release --locked
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Package and check executable version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: >-
          python .github/scripts/package_release.py
          --target ${{ matrix.target }}
          --binary target/release/${{ matrix.binary }}
      - name: Check packaged executable
        shell: bash
        run: python .github/scripts/check_package.py dist
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: rustdm-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
